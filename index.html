<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>中和弦音樂島</title>
<meta name="description" content="中和國小弦樂團（中和弦）的互動小島：活動預告、團員的一天、作曲家的故事、志工招募。">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* Layout: a full-screen illustrated island. Cream UI floats on top: logo card (top-left), tool buttons (right), event card (bottom). */
:root{
  --bg:#F6F1E3; --fg:#2E3326; --muted:#5E6450; --card:#FFFDF6; --line:#D8D0B6;
  --sea:#2F7F7B; --orange:#B8500F; --orange-ink:#FFFFFF; --soft:#DDEBE3;
  --good:#2E7D46; --shadow:0 1px 2px rgba(40,50,30,.10),0 8px 20px rgba(40,50,30,.14);
  --stage-a:#9BDAD3; --stage-b:#78C2BC;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121B1B; --fg:#E8EFE6; --muted:#A3B1A3; --card:#1B2726; --line:#2F4040;
    --sea:#7FD0C8; --orange:#FF9B57; --orange-ink:#1A1206; --soft:#1F3532;
    --good:#6FD39C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
    --stage-a:#12403F; --stage-b:#0C2E31; color-scheme:dark;
  }
  :root:not([data-theme="light"]) #land{filter:brightness(.62) saturate(.85)}
  :root:not([data-theme="light"]) #clouds{opacity:.35}
}
:root[data-theme="dark"]{
  --bg:#121B1B; --fg:#E8EFE6; --muted:#A3B1A3; --card:#1B2726; --line:#2F4040;
  --sea:#7FD0C8; --orange:#FF9B57; --orange-ink:#1A1206; --soft:#1F3532;
  --good:#6FD39C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  --stage-a:#12403F; --stage-b:#0C2E31; color-scheme:dark;
}
:root[data-theme="dark"] #land{filter:brightness(.62) saturate(.85)}
:root[data-theme="dark"] #clouds{opacity:.35}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-bottom:40px}
.pad{display:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}

/* page: header, event card, a sticky tool bar, then the map itself (nothing floats over the map) */
.wrap{max-width:560px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px))}
.logo{display:flex;gap:10px;align-items:center;padding:max(12px,env(safe-area-inset-top,0px)) 0 10px}
.mark{width:44px;height:44px;border-radius:13px;background:var(--sea);color:var(--bg);display:grid;place-items:center;flex:none}
.logo small{display:block;font-size:12px;letter-spacing:.05em;color:var(--muted);line-height:1.3}
.logo b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.2}
.logo em{font-style:normal;color:var(--orange)}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 0;margin:6px 0 8px;background:var(--bg)}
.bar button{white-space:nowrap;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:54px;display:grid;place-items:center;align-content:center;gap:1px;font-size:11.5px;font-weight:600;line-height:1.2;padding:0 2px}
.bar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar button[aria-pressed="true"]{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.bar button:active,.now:active{transform:scale(.97)}
.stage{background:linear-gradient(var(--stage-a),var(--stage-b));border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
#scene{display:block;width:100%;height:auto}
.role{grid-template-columns:28px 1fr;cursor:pointer}
.role input{width:22px;height:22px;accent-color:var(--orange)}
.bird{display:none}

/* floating labels in the scene */
.pb{fill:#F5A04A;stroke:#FFF8E6;stroke-width:2}
.pt{font-family:var(--f-body);font-weight:700;font-size:11.5px;fill:#3A1E04;dominant-baseline:central}
.pn{font-family:var(--f-body);font-weight:700;font-size:9.5px;fill:#8A3B05;text-anchor:middle;dominant-baseline:central}
.bt{font-family:var(--f-body);font-weight:700;font-size:11.5px;fill:#7A3A06;text-anchor:middle;dominant-baseline:central}

.il{font-family:var(--f-body);font-weight:700;font-size:11.5px;fill:#2F6F6B;text-anchor:middle;dominant-baseline:central}
.stem{stroke:#FFF8E6;stroke-width:2;stroke-linecap:round}
.pill{cursor:pointer;outline:none}
.pill:hover .pb{fill:#FFB866}
.pill:focus-visible .pb{stroke:#2E3326;stroke-width:3.5}
.ring{fill:none;stroke:#FFF8E6;stroke-width:3;transform-box:fill-box;transform-origin:center}
#mood{pointer-events:none}
#clouds{pointer-events:none}

/* event card */
.now{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.now .big{display:grid;justify-items:center;line-height:1.1;min-width:58px}
.now .big b{font-family:var(--f-display);font-size:38px;color:var(--orange);font-variant-numeric:tabular-nums}
.now .big b.s{font-size:26px}
.now .big i{font-style:normal;font-size:12px;color:var(--muted)}
.now .kk{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--orange);font-weight:700}
.now .tt{display:block;font-family:var(--f-display);font-weight:900;font-size:16px;line-height:1.3}
.now .ff{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.now .go{font-size:24px;color:var(--muted)}

.modes,.simrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin:16px 0 8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
footer{margin-top:14px;color:var(--muted);font-size:12.5px;line-height:1.7}

@media (prefers-reduced-motion:no-preference){
  .bob{animation:bob 3.2s ease-in-out infinite alternate}
  .ring{animation:ring 1.9s ease-out infinite}
  .cloud{animation:drift 46s ease-in-out infinite alternate}
  .wv{animation:wv 5s ease-in-out infinite alternate}
  .tw{animation:tw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
}
@media (prefers-reduced-motion:no-preference){
  .nt{opacity:0;animation:rise 4.5s ease-out infinite}
  .bat{transform-box:fill-box;transform-origin:0% 100%;animation:bat .8s ease-in-out infinite alternate}
}
@media (prefers-reduced-motion:reduce){.nt{opacity:.85}}
.wk{cursor:pointer}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(10px,-36px)}}
@keyframes bat{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
.cmp{display:grid;gap:10px}
.cmp .box h4{margin:0;font-family:var(--f-display);font-size:17px}
.cmp .yr{font-size:12.5px;color:var(--muted)}
.cmp .sp{display:inline-block;font-size:12px;background:var(--soft);color:var(--sea);border-radius:6px;padding:1px 8px;margin:6px 0 0}
.cmp .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cmp .row .play{min-height:40px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){
  .sub button.hint{animation:pulse 1.8s ease-in-out infinite}
  .bird{display:inline;animation:fly 36s linear infinite}
}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(245,160,74,.5)}}
@keyframes fly{from{transform:translate(-60px,0)}50%{transform:translate(220px,-14px)}to{transform:translate(480px,0)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.3,1.7);opacity:0}}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(70px)}}
@keyframes wv{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes tw{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.1)}}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(8,14,28,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.veil[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--bg);padding:10px 0;margin-top:-10px;z-index:2}
.sheet-top h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.x{border:1px solid var(--line);background:var(--card);border-radius:999px;min-width:44px;min-height:44px;font-size:18px;flex:none}
.sheet p{margin:8px 0}
.sheet h3{font-family:var(--f-display);font-size:16px;margin:18px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note{font-size:13px;color:var(--muted)}
.ai{display:inline-block;font-size:11px;letter-spacing:.08em;background:var(--soft);color:var(--sea);border-radius:6px;padding:1px 7px;margin-right:6px}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols2 ul{margin:4px 0 0;padding-left:1.1em}
.cols2 h4{margin:0;font-size:14px;color:var(--sea)}
.todo{border:1px dashed var(--orange);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13.5px}

.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:2.2em 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px;width:100%}
.li .no{width:2.2em;height:2.2em;border-radius:50%;background:#F5A04A;color:#3A1E04;font-weight:700;font-size:13px;display:grid;place-items:center}

/* timeline */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li::before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--sea);border:2px solid var(--bg)}
.tl li.next::before{background:var(--orange)}
.tl .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .t{font-weight:700}
.tl .c{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted)}
.tl p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* steps */
.steps{display:grid;gap:8px;list-style:none;padding:0;margin:8px 0}
.steps li{display:grid;grid-template-columns:4.2em 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.steps time{font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--orange);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 2px}
.track i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}

/* instruments */
.inst{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.inst .box b{font-family:var(--f-display)}
.inst .box span{display:block;font-size:13px;color:var(--muted)}
.quiz{display:grid;gap:8px;margin-top:8px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:6px 10px;font-weight:500}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.opt.no{border-color:var(--orange)}
.play{background:var(--orange);color:var(--orange-ink);border:0;border-radius:12px;min-height:48px;font-weight:700;padding:0 16px}
.quiz .msg{min-height:1.6em;font-weight:500}

/* graph */
.graph{width:100%;height:auto;max-height:420px;display:block}
.graph .e{stroke:var(--line);stroke-width:2;transition:stroke .2s,opacity .2s}
.graph .e.on{stroke:var(--orange);stroke-width:3}
.graph .dim{opacity:.25}
.graph .n circle{fill:var(--card);stroke:var(--sea);stroke-width:2}
.graph .n.sel circle{fill:var(--orange);stroke:var(--orange)}
.graph .n text{fill:var(--fg);font-size:12px;font-weight:700;text-anchor:middle;font-family:var(--f-body)}
.graph .n.sel text{fill:var(--orange-ink)}
.graph .n{cursor:pointer}

/* honors, faq */
.honor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.honor + .honor{margin-top:8px}
.badge{font-weight:700;color:var(--orange)}
.faq-in{display:flex;gap:8px;margin:8px 0}
.faq-in input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:0 12px;font:inherit}
.faq-in button{min-height:48px;padding:0 16px;border:0;background:var(--sea);color:#fff;border-radius:12px;font-weight:700}
:root[data-theme="dark"] .faq-in button{color:#0D1526}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .faq-in button{color:#0D1526}}
.ans{min-height:3.5em}

/* growth + welcome */
.pbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--orange);border-radius:6px}
.nowtxt{margin:10px 2px 0;font-size:13.5px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wk{transition:opacity .45s}
#guide{display:none}
#guide h2{font-family:var(--f-display);font-size:19px;margin:6px 0 2px}#guide h2 small{font-size:12.5px;font-weight:400;color:var(--muted);font-family:var(--f-body)}
#guide .gt{font-size:12.5px;color:var(--muted);letter-spacing:.06em;margin:12px 2px 6px}
#guide .li{position:relative}#guide .ok{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--good);font-weight:700}
@media (min-width:1000px){
  body{padding-bottom:20px}
  .wrap{max-width:1560px;display:grid;grid-template-columns:minmax(0,1fr) 410px;column-gap:24px;align-items:start}
  .wrap>*{grid-column:2}
  .wrap>.stage{grid-column:1;grid-row:1/span 14;position:sticky;top:16px;margin-top:16px}
  #guide{display:block}
  .bar #bList{display:none}.bar{grid-template-columns:repeat(5,1fr)}
  .veil{background:transparent;justify-content:flex-end;align-items:stretch;pointer-events:none}
  .sheet{pointer-events:auto;width:440px;max-width:440px;height:100vh;max-height:none;border-radius:0;box-shadow:-10px 0 34px rgba(0,0,0,.22)}
}
.gdot{display:inline-block;width:18px;height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px;vertical-align:middle}
.leg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.gbar{display:flex;gap:4px;margin-top:6px}.gbar i{flex:1;height:10px;border-radius:5px;background:var(--line)}.gbar i.on{background:var(--good)}
.lbl{display:block;margin-top:8px;font-size:13.5px}.lbl input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
#welcome{position:fixed;inset:0;z-index:40;background:linear-gradient(var(--stage-a),var(--stage-b));display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#welcome[hidden]{display:none}
#welcome .wc{max-width:380px;width:100%;background:var(--card);border-radius:24px;padding:28px 22px;box-shadow:var(--shadow)}
#welcome .wm{width:64px;height:64px;border-radius:20px;background:var(--sea);color:var(--bg);display:grid;place-items:center;margin:0 auto 12px}
#welcome h1{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1.25;margin:0}#welcome h1 em{font-style:normal;color:var(--orange)}
#welcome .wn{margin:14px 0 4px;font-size:13px;color:var(--muted)}#welcome .wt{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
#welcome .wg{margin:10px 0 0;font-size:14px;color:var(--good);min-height:1.5em}
#welcome button{display:block;width:100%;margin-top:12px;min-height:52px;border-radius:14px;font-size:17px;font-weight:700}
#wGo{background:var(--orange);color:var(--orange-ink);border:0}#wMute{background:transparent;border:1px solid var(--line);color:var(--fg);font-size:14px!important;min-height:44px!important}
</style>


<div class="wrap">
  <header class="logo">
    <span class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M11 18V6l10-2v12"/></svg></span>
    <span><small>中和國小弦樂團　後援會</small><b>中和弦<em>音樂島</em></b></span>
  </header>
  <button class="now" id="banner"></button>
  <nav class="bar" role="toolbar" aria-label="地圖工具">
    <button id="bMus" class="hint" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M11 18V6l10-2v12"/></svg><span id="musT">音樂關</span></button>
    <button id="bProg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span id="progT">0/10 探索</span></button>
    <button id="bAll" aria-label="全景"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>全景</span></button>
    <button id="bGrow" aria-label="成長"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 6 5 6c0 4 3 6 7 6z"/><path d="M12 14c0-3.500 2.500-6 7-6 0 3.500-2.500 6-7 6z"/></svg><span>成長</span></button>
    <button id="bList" aria-label="清單"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>清單</span></button>
    <button id="bTime" aria-label="時間"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span>時間</span></button>
  </nav>
  <div id="guide" aria-label="島嶼導覽"></div>
  <div class="stage" id="stage">

const applyVB=()=>SC.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));
function setVB(t,ms,cb){
  cancelAnimationFrame(raf);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!ms){vb=t.slice();applyVB();cb&&cb();return}
  const f=vb.slice(),s=performance.now();
  const step=now=>{const k=Math.min(1,(now-s)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;vb=f.map((v,i)=>v+(t[i]-v)*e);applyVB();if(k<1)raf=requestAnimationFrame(step);else cb&&cb()};
  raf=requestAnimationFrame(step);
}

/* ---------- sound (Web Audio, started by a tap) ---------- */
function tone(hzs){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audio=audio||new AC();if(audio.state==='suspended')audio.resume();
    const t0=audio.currentTime+0.05;
    hzs.forEach((f,i)=>{
      const t=t0+i*0.42;
      [1,2,3].forEach((mul,j)=>{
        const o=audio.createOscillator(),g=audio.createGain(),lp=audio.createBiquadFilter();
        o.type='sawtooth';o.frequency.value=f*mul;lp.type='lowpass';lp.frequency.value=2200;
        const peak=[0.16,0.07,0.04][j]*(f<80?1.6:1);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+0.05);g.gain.exponentialRampToValueAtTime(0.0005,t+0.5);
        o.connect(lp);lp.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+0.55);
      });
    });
  }catch(e){}
}

/* string-like melody player: notes are [name, beats]; one tap plays, tap again stops */
const NOTEHZ=n=>{const m=/^([A-G])(#?)(\d)$/.exec(n);const st={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0)+(+m[3]+1)*12;return 440*Math.pow(2,(st-69)/12)};
let melStop=null;
function playMel(notes,bpm,done){
  try{
    if(melStop){melStop();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audio=audio||new AC();if(audio.state==='suspended')audio.resume();
    const master=audio.createGain();master.gain.value=.9;master.connect(audio.destination);
    let t=audio.currentTime+.08;const sp=60/bpm,oscs=[];
    notes.forEach(([n,b])=>{
      const f=NOTEHZ(n),d=b*sp;
      [-6,6].forEach(det=>{
        const o=audio.createOscillator(),g=audio.createGain(),lp=audio.createBiquadFilter(),lfo=audio.createOscillator(),lg=audio.createGain();
        o.type='sawtooth';o.frequency.value=f;o.detune.value=det;
        lfo.frequency.value=5.2;lg.gain.value=f*.006;lfo.connect(lg);lg.connect(o.frequency);
        lp.type='lowpass';lp.frequency.value=Math.min(3200,f*5);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075,t+Math.min(.08,d*.4));
        g.gain.setValueAtTime(.075,t+d*.75);g.gain.linearRampToValueAtTime(0,t+d*.98);
        o.connect(lp);lp.connect(g);g.connect(master);
        o.start(t);lfo.start(t);o.stop(t+d);lfo.stop(t+d);oscs.push(o,lfo);
      });
      t+=d;
    });
    const total=(t-audio.currentTime)*1000;
    const tm=setTimeout(()=>{melStop=null;done&&done()},total);
    melStop=()=>{clearTimeout(tm);master.gain.value=0;oscs.forEach(o=>{try{o.stop()}catch(e){}});melStop=null;done&&done()};
  }catch(e){melStop=null;done&&done()}
}

    $('#vinvok').textContent=ok?'已複製！貼到 LINE 或粉專，再補上音樂島連結。':'沒辦法自動複製，請到後援會群組直接輸入邀請文。';
  };
  const build=()=>{
    const picked=[...document.querySelectorAll('.rk:checked')].map(c=>ROLES[c.value][0]);
    const n=$('#vn').value.trim(),t=$('#vt').value.trim();
    $('#vmsg').value=picked.length?`您好，我是${n||'（請填稱呼）'}，想加入中和弦後援會當志工。\n我想幫忙的位置：${picked.join('、')}。${t?'\n方便的時間：'+t+'。':''}\n謝謝！`:'先勾選上面的位置。';
  };
  $('#roles').addEventListener('change',build);$('#vn').addEventListener('input',build);$('#vt').addEventListener('input',build);
  $('#vcopy').onclick=async()=>{
    const ta=$('#vmsg');if(!document.querySelector('.rk:checked')){$('#vok').textContent='請先勾選至少一個位置。';return}
    let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){try{ta.removeAttribute('readonly');ta.select();ok=document.execCommand('copy');ta.setAttribute('readonly','')}catch(e2){}}
    $('#vok').textContent=ok?'已複製！到後援會 LINE 群組貼上就好。':'沒辦法自動複製，請長按上面的文字，選「拷貝」。';
  };
};
